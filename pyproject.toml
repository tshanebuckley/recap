[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
license = "MIT"
name = "recap"
authors = [{ name = "Shane Buckley" }]
dynamic = ["version"]
description = "recap (Reconstruction of Cellular Architecture and Phenotypes): nuclear segmentation, counting and HSV-1 infection scoring (DAPI + ICP8)"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.2",
    "scikit-image>=0.25",
    "tifffile>=2024.8",
    "imagecodecs>=2024.6",
    "pyyaml>=6",
    "pydantic>=2.6",
    "sqlmodel>=0.0.50,<0.0.51",
    "alembic>=1.13,<2",
    "ruamel.yaml>=0.18,<0.19",
    "typer>=0.12",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
stardist = ["stardist>=0.9", "tensorflow>=2.15"]
cellpose = ["cellpose>=4.2,<5"]
gui = ["napari[pyqt6]>=0.10,<0.11"]  # recap gui (desktop app)
test = ["pytest>=8"]

[project.scripts]
recap = "recap.cli:app"

# recap's panels as a napari plugin (Plugins menu in any napari; docked by `recap gui`)
[project.entry-points."napari.manifest"]
recap = "recap:napari.yaml"

[tool.hatch.version]
path = "src/recap/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/recap"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = [
    "B905",   # zip() without strict=: lengths are equal by construction throughout
    "E741",   # single-letter names such as l are used for labels in image code
]

[tool.ruff.lint.isort]
known-first-party = ["recap"]

[tool.ruff.format]
quote-style = "double"
