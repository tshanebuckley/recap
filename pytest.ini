[pytest]
testpaths = tests
addopts = -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning:skimage
    # napari's pytest plugin (loaded automatically) uses a deprecated pydantic option
    ignore:.*json_encoders.*:DeprecationWarning
markers =
    slow: needs StarDist/TensorFlow and minutes of CPU (run with RECAP_SLOW_TESTS=1)
